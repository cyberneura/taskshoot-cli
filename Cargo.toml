[package]
name = "taskshoot"
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
description = "Taskshoot task operations CLI (AI-agent friendly)"
authors = ["Yotsuyanagi <t@ytyng.com>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/cyberneura/taskshoot-cli"
homepage = "https://taskshoot.com"
readme = "README.md"
keywords = ["taskshoot", "cli", "task", "productivity"]
categories = ["command-line-utilities"]
# Claude Code plugin marketplace 用のファイルは crate に含めない。
exclude = ["/plugins", "/.claude-plugin"]

[[bin]]
name = "taskshoot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
shlex = "1"
unicode-width = "0.2"
uuid = "1"
wait-timeout = "0.2"

[profile.release]
strip = true

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"
