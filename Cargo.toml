[package]
name = "taskshoot-cli"
version = "0.1.0"
edition = "2021"
description = "Taskshoot task operations CLI (AI-agent friendly)"

[[bin]]
name = "taskshoot"
path = "src/main.rs"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
percent-encoding = "2"
reqwest = { version = "0.12", default-features = false, features = [
    "blocking",
    "json",
    "multipart",
    "rustls-tls",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shlex = "1"
unicode-width = "0.2"
uuid = "1"
wait-timeout = "0.2"

[profile.release]
strip = true
