# fmt / clippy / test の実体。ci.yml (PR・main) と、cargo-dist が生成する
# release.yml の custom-test (タグ push) の両方から呼ばれる。
#
# 再利用ワークフローにしているのは、リリースがタグ push という **ci.yml とは別の
# run** で始まるため。ci.yml の結果は参照できず、タグは CI を通っていない
# コミットにも打てる。同じ内容を 2 か所に書き写すとどちらかが古くなるので、
# 実体はここ 1 か所に置く。
name: Test

on:
  workflow_call:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install the Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test
